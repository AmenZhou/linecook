  <!-- Pillar 1: Security -->
  <g>
    <!-- Card background -->
    <rect x="30" y="100" width="160" height="260" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Checkbox icon -->
    <rect x="50" y="120" width="28" height="28" rx="4" fill="#ef4444" stroke="#ef4444" stroke-width="2"/>
    <text x="64" y="142" font-size="18" font-weight="bold" text-anchor="middle" fill="white">✓</text>

    <!-- Title -->
    <text x="100" y="145" font-size="14" font-weight="bold" fill="#1f2937">Security</text>

    <!-- Items -->
    <text x="50" y="175" font-size="12" fill="#374151">□ Permission config</text>
    <text x="50" y="200" font-size="12" fill="#374151">□ Deny-list patterns</text>
    <text x="50" y="225" font-size="12" fill="#374151">□ PreToolUse hooks</text>
    <text x="50" y="250" font-size="12" fill="#374151">□ K8s mutations gated</text>
    <text x="50" y="275" font-size="12" fill="#374151">□ Secrets protected</text>

    <!-- Status -->
    <text x="100" y="330" font-size="11" font-weight="600" text-anchor="middle" fill="#6b7280">Start: permission-audit</text>
